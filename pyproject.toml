[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "export-sales-platform"
version = "0.1.0"
description = "Modular export lead qualification and CRM-ready platform"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
 "pydantic-settings>=2.5", "python-multipart>=0.0.9", "jinja2>=3.1",
 "pandas>=2.2", "openpyxl>=3.1", "requests>=2.32",
 "beautifulsoup4>=4.12", "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]
